name: CI

permissions:
  contents: read

# CI 改为仅手动触发（workflow_dispatch），不在 push/PR 时自动运行，避免邮件打扰。
# 本地仍按 AGENTS.md 在提交前跑 typecheck + test + build。
on:
  workflow_dispatch:

jobs:
  build:
    name: lint + format + typecheck + test + build + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
      - run: npm ci
      # 格式与 lint 作为硬门槛（顺序固定）
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build
        env:
          FLUXBLOG_SITE_URL: ${{ vars.FLUXBLOG_SITE_URL }}
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E
        run: npm run test:e2e
