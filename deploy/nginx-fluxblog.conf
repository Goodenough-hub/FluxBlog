# /etc/nginx/conf.d/finflow.conf 中 /blog/ 段的参考配置（SSR 重写后）。
# 替换原 alias /var/www/fluxblog/ 静态块为 proxy_pass 到 fluxblog.service（127.0.0.1:4321）。
# _astro 静态资源仍由 nginx 直接服务（@astrojs/node standalone 不自带静态资源服务）。
# pagefind 段已删除（搜索改后端 /posts/search）。
# 改后必须 `nginx -t` 再 `systemctl reload nginx`。保留现有 /admin/ 与 /api/v1/。

location = /blog { return 301 /blog/; }

location /blog/ {
  proxy_pass http://127.0.0.1:4321;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Real-IP $remote_addr;
}

# 静态资源（_astro、public/）长缓存：内容寻址，immutable。
location /blog/_astro/ {
  alias /var/www/fluxblog/client/_astro/;
  expires 1y;
  add_header Cache-Control "public, immutable";
}
