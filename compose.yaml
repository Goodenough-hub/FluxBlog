services:
  app:
    image: node:22-alpine
    ports:
      - 4321:4321
    working_dir: /app
    command: >
      sh -c "
      npm install
      && npm run dev -- --host 0.0.0.0"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4321/blog/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    volumes:
      - ./:/app
      - /app/node_modules
